org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- App identity: change ONLY these four lines to spin up a new, independently
# installable app from this same codebase (e.g. for a different client/business). ---
# BEFORE: applicationId and the app label were hardcoded in three separate files
# (app/build.gradle, AndroidManifest.xml, res/values/strings.xml). Forgetting to change
# even one of them meant a "new" app silently installed OVER the previous one on a phone,
# because Android treats applicationId as the app's real identity, not the visible name.
# AFTER: this is the single place to edit. A different APP_ID means Android always treats
# it as a separate, side-by-side app — no matter how similar the visible name looks.
APP_ID=com.babasitaram.pro
APP_NAME=Guru Shree
APP_VERSION_CODE=2
APP_VERSION_NAME=2.0.0-native
