name: Android Signed APK - Build Verify Install Runtime
# POSIX-sh runtime gate: every if block closes with fi.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE: com.babasitaram.pro
      APK: app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Gradle wrapper
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Generate CI signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v             -keystore release.keystore             -storepass "CI-$GITHUB_RUN_ID-store"             -keypass "CI-$GITHUB_RUN_ID-key"             -alias release             -keyalg RSA -keysize 4096 -validity 10000             -dname "CN=Guru Shree App, OU=Release, O=BabaSitaRam, L=Indore, ST=Madhya Pradesh, C=IN"
          echo "RELEASE_STORE_PASSWORD=CI-$GITHUB_RUN_ID-store" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=CI-$GITHUB_RUN_ID-store" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleRelease
          test -s "$APK"

      - name: Verify APK with apksigner, aapt and unzip
        run: |
          set -euo pipefail
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='$PACKAGE'" apk-badging.txt
          grep -q "application-label:'Guru Shree App'" apk-badging.txt
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "assets/logo.webp"
          echo "APK_VERIFY=PASS" | tee verification.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guru-Shree-App-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk-badging.txt
            verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enable KVM for stable emulator runtime
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Install and runtime smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2G
          heap-size: 1G
          disk-size: 6G
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: |
            adb wait-for-device
            adb install -r "$GITHUB_WORKSPACE/$APK" || (adb reconnect || true; sleep 5; adb wait-for-device; adb install -r "$GITHUB_WORKSPACE/$APK")
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" 1
            sleep 12
            adb shell dumpsys package "$PACKAGE" | grep -q "$PACKAGE"
            adb shell dumpsys activity activities | grep -q "$PACKAGE"
            adb shell pidof "$PACKAGE" >/dev/null
            adb exec-out screencap -p > runtime-screen-1.png
            test -s runtime-screen-1.png
            adb shell input swipe 540 1500 540 500 600
            sleep 2
            adb shell input swipe 540 1500 540 500 600
            adb exec-out screencap -p > runtime-screen-2.png
            test -s runtime-screen-2.png
            adb logcat -c
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" 1 >/dev/null
            sleep 10
            adb logcat -d -t 1000 > runtime-logcat.txt
            grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: $PACKAGE" runtime-logcat.txt && { echo "Runtime crash detected"; tail -200 runtime-logcat.txt; exit 1; }
            echo "INSTALL_RUNTIME=PASS" | tee -a verification.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-verification-evidence
          path: |
            runtime-screen-1.png
            runtime-screen-2.png
            runtime-logcat.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GitHub Release
        if: success()
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_TOKEN"
          TAG="v$GITHUB_RUN_NUMBER"
          gh release create "$TAG" "$APK"             --repo "$GITHUB_REPOSITORY"             --title "Guru Shree App $TAG"             --notes "Signed APK. APK signature/structure checks and Android emulator install/runtime smoke test passed."
