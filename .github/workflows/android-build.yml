name: Android Native Signed APK - Build Verify Runtime
on:
  push:
    branches: [ main, final-native-all-phases-bsrpro-backup ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-native-release
  cancel-in-progress: true
jobs:
  build-verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE: com.babasitaram.pro
      APK: app/build/outputs/apk/release/app-release.apk
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Create Gradle wrapper
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
      - name: Set up release signing key
        run: |
          set -euo pipefail
          # BEFORE: a brand-new random keystore was generated on every single run, so every
          # build had a different signature and Android refuses to install an "update" signed
          # by a different key — users had to uninstall (losing local data) before every update.
          # AFTER: if the repo owner has added a persistent keystore as GitHub Secrets
          # (RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD, see the
          # project README), that key is reused every time so updates install cleanly. Until
          # those secrets are added, it falls back to the old ephemeral per-run key so CI keeps
          # working — but every such build remains a fresh, non-upgradable signature.
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using persistent signing key from repository secrets."
          else
            keytool -genkeypair -v -keystore release.keystore -storepass "CI-$GITHUB_RUN_ID-key" -keypass "CI-$GITHUB_RUN_ID-key" -alias release -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Guru Shree App, OU=Release, O=BabaSitaRam, L=Indore, ST=Madhya Pradesh, C=IN"
            echo "RELEASE_STORE_PASSWORD=CI-$GITHUB_RUN_ID-key" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=CI-$GITHUB_RUN_ID-key" >> "$GITHUB_ENV"
            echo "::warning::No persistent signing key configured — this build uses a throwaway key and CANNOT be installed as an update over a previous install. See README for how to add one."
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Build release APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleRelease
          test -s "$APK"
      - name: Verify APK
        run: |
          set -euo pipefail
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='$PACKAGE'" apk-badging.txt
          grep -q "application-label:'Guru Shree'" apk-badging.txt
          unzip -t "$APK" >/dev/null
          grep -q "application-icon-160:'res/.*\\.webp'" apk-badging.txt
          ! unzip -l "$APK" | grep -Eiq "androidx/webkit"
          echo "APK_VERIFY=PASS" | tee verification.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Guru-Shree-native-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk-badging.txt
            verification.txt
          if-no-files-found: error
          retention-days: 30
      - name: Read app version
        id: appver
        run: |
          set -euo pipefail
          V="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          echo "name=$V" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        # NEW: previously the signed APK only ever landed in the 30-day Actions artifact, which
        # isn't a stable, easy-to-find download link. Every successful build on `main` now also
        # publishes/updates a GitHub Release with the APK attached directly — a permanent link
        # the user (or their customers) can download the app from, same as a normal app release.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.name }}
          name: Guru Shree v${{ steps.appver.outputs.name }}
          body: Automated build from commit ${{ github.sha }}. See apk-badging.txt in the build artifact for package/label verification details.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          test -e /dev/kvm

      - name: Native Android runtime test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2G
          heap-size: 1G
          disk-size: 6G
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            set -eu
            adb wait-for-device
            adb install -r "$GITHUB_WORKSPACE/$APK"
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" 1
            sleep 6
            adb shell pidof "$PACKAGE" >/dev/null
            adb shell input keyevent 4
            sleep 2
            adb shell pidof "$PACKAGE" >/dev/null
            adb exec-out screencap -p > native-runtime.png
            test -s native-runtime.png
            echo "NATIVE_RUNTIME=PASS" | tee -a verification.txt
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-evidence
          path: native-runtime.png
          if-no-files-found: ignore
          retention-days: 30
