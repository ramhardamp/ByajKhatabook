plugins {
    id 'com.android.application'
}

def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD")

android {
    namespace 'com.babasitaram.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.babasitaram.pro'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file("release.keystore")
            storePassword releaseStorePassword
            keyAlias 'release'
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.17.1"
}

tasks.register("syncWebIndex", Copy) {
    from(rootProject.file("index.html"))
    into(project.file("src/main/assets"))
}

tasks.named("preBuild").configure {
    dependsOn("syncWebIndex")
}
